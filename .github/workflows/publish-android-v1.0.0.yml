name: Publish RGB Geometry Live 1.0.0
on:
  push:
    branches: [master]
    paths: [.github/workflows/publish-android-v1.0.0.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and verify the signed APK
        run: |
          apk=RGB-Geometry-Live-1.0.0.apk
          curl --fail --silent --show-error --location --retry 4 \
            https://wallpapers.klob.io/releases/staging/"$apk" --output "$apk"
          printf '%s  %s\n' c3b2dae82ef8ef3a55c07fe35e7917213a59a0be59a31ab51abe76e9997c67e1 "$apk" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v1.0.0 RGB-Geometry-Live-1.0.0.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "RGB Geometry Live for Android 1.0.0" \
            --notes "Native animated RGB Geometry wallpaper for Android 13 and later. Includes four patterns, adjustable RGB cycling, and optional Pixel 11 Pro XL frame, camera ring, dock and status-bar outlines."
