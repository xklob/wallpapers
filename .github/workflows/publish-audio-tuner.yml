name: Publish RGB Geometry Live Audio Tuner preview
on:
  push:
    branches: [audio-sync]
    paths: [.github/workflows/publish-audio-tuner.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa9880673de22a785a0eb31002d690a7451e951e
      - name: Fetch and verify the signed APK
        run: |
          apk=RGB-Geometry-Live-1.1.0-preview.2.apk
          curl --fail --silent --show-error --location --retry 4 \
            https://wallpapers.klob.io/releases/staging/"$apk" --output "$apk"
          printf '%s  %s\n' 4e07cffcb951625072b9a108092de49f7aff77f40cdc7de32a759bc5120c40b2 "$apk" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish Audio Tuner preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-v1.1.0-preview.2
        run: |
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          - Adds an Audio Sync tuner with Pulse + color, Brightness pulse, Color acceleration, and Diagonal color wave.
          - Adjust intensity, smoothness, and bass sensitivity live, or reset the tuner to its defaults.
          - Choose Device audio or Microphone. For room sound, use **Start microphone** after selecting Microphone. The recorder runs only while the wallpaper or preview is visible.

          The APK carries the same signature as Preview 1 and updates it in place. Microphone capture still needs an on-device check.
          NOTES
          gh release create "$RELEASE_TAG" RGB-Geometry-Live-1.1.0-preview.2.apk SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "RGB Geometry Live 1.1.0 Preview 2 · Audio Tuner" --notes-file "$RUNNER_TEMP/notes.md"
