name: Render wallpapers and publish release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
concurrency:
  group: wallpaper-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Render PNG wallpapers
        run: |
          python src/render_png.py
          python src/render_camera.py
      - name: Render native SVG wallpapers
        run: python src/render_vectors.py --data-root . --output renders/svg
      - name: Validate and package collection
        run: |
          python src/validate.py
          python src/package_release.py
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/png renders/svg catalog.json
          git diff --cached --quiet || git commit -m "Render PNG and SVG wallpaper collection"
          git push origin HEAD:master
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target master --title "RGB geometry · PNG + SVG wallpapers" --notes-file docs/RELEASE_NOTES.md
          fi
