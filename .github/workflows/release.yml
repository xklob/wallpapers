name: Build wallpaper release

on:
  push:
    branches: [master]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the release
        default: v1.2.1
        required: true

permissions:
  contents: write

concurrency:
  group: wallpaper-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Import the Pixel alignment update
        run: |
          if grep -q '"wallpaper_viewports"' config/camera_profiles_additions.json; then exit 0; fi
          bundle="$RUNNER_TEMP/rgb-geometry-v1.2.1-package.tar.gz"
          curl --fail --silent --show-error --location --retry 4 --output "$bundle" \
            https://wallpapers.klob.io/rgb-geometry-v1.2.1-package.tar.gz
          printf '%s  %s\n' e3c77113665d28e98809f26c822a8f088d555adb80c29b28a960a8042994373d "$bundle" | sha256sum --check
          tar -xzf "$bundle"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render updated PNGs and build ZIPs
        run: |
          npm install --prefix "$RUNNER_TEMP/wallpaper-tools" --no-save --no-audit --no-fund sharp@0.34.5
          WALLPAPER_SHARP_MODULE="$RUNNER_TEMP/wallpaper-tools/node_modules/sharp" node src/render_updated_pngs.mjs
          python3 src/package_release.py

      - name: Commit rendered wallpapers and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md config docs renders site src
          if ! git diff --cached --quiet; then
            git commit -m 'Calibrate Pixel 11 Pro XL camera and launcher outlines'
            git push origin HEAD:master
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.2.1' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip --target "$(git rev-parse HEAD)" \
              --title 'RGB Geometry Wallpapers 1.2.1' --notes-file docs/RELEASE_NOTES.md
          fi
