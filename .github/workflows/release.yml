name: Render wallpapers and publish release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
concurrency:
  group: wallpaper-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import the verified initial source bundle
        if: ${{ hashFiles('config/cells.json') == '' }}
        run: |
          curl --fail --silent --show-error --location --retry 3 https://klob-wallpapers.deep-krill-3494.chatgpt.site/rgb-geometry-source.tar.gz -o /tmp/wallpaper-source.tar.gz
          echo '30e44e71e3178d7d921231adace206cdd8cf3b619663ebc95d11165d23c5734f  /tmp/wallpaper-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/wallpaper-source.tar.gz
      - name: Install rendering tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: wallpapers
          create-args: >-
            python=3.12 imagemagick=7 numpy pillow scipy
          cache-environment: true
      - name: Render PNG wallpapers
        run: |
          python src/render_png.py
          python src/render_camera.py
      - name: Render native SVG wallpapers
        run: python src/render_vectors.py --data-root . --output renders/svg
      - name: Validate and package collection
        run: |
          python src/validate.py
          python src/package_release.py
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets config docs src requirements.txt renders/svg
          git diff --cached --quiet || git commit -m "Import sources and SVG wallpapers"
          for design in renders/png/0*/; do
            git add "$design"
            git diff --cached --quiet || git commit -m "Add PNG wallpapers for $(basename "$design")"
            git push origin HEAD:master
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target master --title "RGB geometry · PNG + SVG wallpapers" --notes-file docs/RELEASE_NOTES.md
          fi
