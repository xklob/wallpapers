name: Build wallpaper release

on:
  push:
    branches: [master]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag for the release
        default: v1.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: wallpaper-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Import the v1.1 source update
        if: ${{ hashFiles('config/refresh_png.json') == '' }}
        run: |
          bundle="$RUNNER_TEMP/rgb-geometry-v1.1.0-source.tar.gz"
          curl --fail --silent --show-error --location --retry 4 --output "$bundle" \
            https://wallpapers.klob.io/rgb-geometry-v1.1.0-source.tar.gz
          printf '%s  %s\n' 4320be495c5e4ca602a69f6a1bdc548f2d776c8f60046902804ae68d95d0fddb "$bundle" | sha256sum --check
          tar -xzf "$bundle"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render updated PNGs and build ZIPs
        run: |
          npm install --prefix "$RUNNER_TEMP/wallpaper-tools" --no-save --no-audit --no-fund sharp@0.34.5
          WALLPAPER_SHARP_MODULE="$RUNNER_TEMP/wallpaper-tools/node_modules/sharp" node src/render_updated_pngs.mjs
          python3 src/package_release.py

      - name: Commit rendered wallpapers and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md config docs renders site src
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh device catalog and desktop wallpapers'
            git push origin HEAD:master
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.1.0' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip --target "$(git rev-parse HEAD)" \
              --title 'RGB Geometry Wallpapers 1.1' --notes-file docs/RELEASE_NOTES.md
          fi
