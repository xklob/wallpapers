name: Publish RGB Geometry Live Preview 3
on:
  push:
    branches: [audio-sync]
    paths: [.github/workflows/publish-screen-layouts.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3463eaad690c2c4bf1ca001659a0b643f0c64124
      - name: Verify the signed preview APK
        run: |
          apk=RGB-Geometry-Live-1.1.0-preview.3.apk
          curl --fail --silent --show-error --location --retry 4 \
            https://wallpapers.klob.io/releases/staging/"$apk" --output "$apk"
          printf '%s  %s\n' fbae7ed4977e31f426397366860870b886a5bac691c973ae1675a8d44fdc17d8 "$apk" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish the Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-v1.1.0-preview.3
        run: |
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          - Edit the Home and Lock artwork separately. The dock and search outline appears only in the Home layout.
          - Apply using Android's wallpaper picker. The available Home, Lock, or both destinations depend on the device and Android version. A wallpaper shared by both screens changes layouts when locking and unlocking.
          - Auto Audio Sync prioritizes device playback and uses the microphone during quiet after you tap **Start microphone fallback**.
          - Updates Preview 2 in place with the same signing certificate.

          Layout resolution and audio switching were tested with simulated state changes. The Android picker, screen transitions, and audio handoff still need a check on a physical Pixel.
          NOTES
          gh release create "$RELEASE_TAG" RGB-Geometry-Live-1.1.0-preview.3.apk SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "RGB Geometry Live 1.1.0 Preview 3 · Home, Lock and Auto Audio" --notes-file "$RUNNER_TEMP/notes.md"
